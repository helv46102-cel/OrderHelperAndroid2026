name: Order Helper Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Crear archivos
        run: |
          mkdir -p app/src/main/java/com/orderhelper/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE"/>

              <application
                  android:allowBackup="true"
                  android:label="Order Helper"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OfferAssistService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="150"
              android:canRetrieveWindowContent="true"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:packageNames="com.walmart.sparkdriver"/>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Order Helper</string>
              <string name="accessibility_description">Analiza las ofertas visibles de Spark y señala las que cumplen tus filtros.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/orderhelper/app/MainActivity.kt <<'EOF'
          package com.orderhelper.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import android.graphics.Typeface

          class MainActivity : Activity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("filters", MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(28), dp(22), dp(24))
                      setBackgroundColor(Color.rgb(8, 12, 18))
                  }

                  val scroll = ScrollView(this)
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  box.addView(txt("🎯 ORDER HELPER", 28f, Color.rgb(120,255,50), true))
                  box.addView(txt("Detecta • Vibra • Suena • Señala", 15f, Color.LTGRAY, false))

                  status = txt("", 18f, Color.WHITE, true)
                  status.setPadding(0, dp(20), 0, dp(10))
                  box.addView(status)

                  box.addView(label("PAGO MÍNIMO ($)"))
                  val minPay = input(prefs.getFloat("minPay", 25f).toString())
                  box.addView(minPay)

                  box.addView(label("$/MILLA MÍNIMO"))
                  val minPerMile = input(prefs.getFloat("minPerMile", 2f).toString())
                  box.addView(minPerMile)

                  box.addView(label("MILLAS MÁXIMAS"))
                  val maxMiles = input(prefs.getFloat("maxMiles", 10f).toString())
                  box.addView(maxMiles)

                  space(box)

                  val save = Button(this).apply {
                      text = "💾 GUARDAR FILTROS"
                      textSize = 17f
                      setOnClickListener {
                          prefs.edit()
                              .putFloat("minPay", minPay.text.toString().toFloatOrNull() ?: 25f)
                              .putFloat("minPerMile", minPerMile.text.toString().toFloatOrNull() ?: 2f)
                              .putFloat("maxMiles", maxMiles.text.toString().toFloatOrNull() ?: 10f)
                              .apply()
                          Toast.makeText(this@MainActivity, "Filtros guardados ✅", Toast.LENGTH_SHORT).show()
                      }
                  }
                  box.addView(save)

                  space(box)

                  val activate = Button(this).apply {
                      text = "⚙️ ACTIVAR ORDER HELPER"
                      textSize = 17f
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  box.addView(activate)

                  space(box)

                  val test = Button(this).apply {
                      text = "📳🔊 PROBAR ALERTA"
                      textSize = 16f
                      setOnClickListener { testAlert() }
                  }
                  box.addView(test)

                  box.addView(
                      txt(
                          "\nUSO\n\n" +
                          "1. Guarda tus filtros.\n" +
                          "2. Activa Order Helper en Accesibilidad.\n" +
                          "3. Abre Spark Driver.\n" +
                          "4. Cuando una oferta visible cumpla tus filtros, sonará, vibrará y aparecerá marcada en verde.\n" +
                          "5. Tú tocas la oferta manualmente.",
                          15f,
                          Color.LTGRAY,
                          false
                      )
                  )

                  scroll.addView(box)
                  root.addView(scroll)
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()

                  val enabled = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: ""

                  if (enabled.contains(packageName, true)) {
                      status.text = "🟢 SNIPER ACTIVO"
                      status.setTextColor(Color.rgb(120,255,50))
                  } else {
                      status.text = "⚪ SNIPER APAGADO"
                      status.setTextColor(Color.LTGRAY)
                  }
              }

              private fun testAlert() {
                  try {
                      val v = getSystemService(VIBRATOR_SERVICE) as Vibrator
                      v.vibrate(
                          VibrationEffect.createOneShot(
                              250,
                              VibrationEffect.DEFAULT_AMPLITUDE
                          )
                      )
                  } catch (_: Exception) {}

                  try {
                      ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100)
                          .startTone(ToneGenerator.TONE_PROP_BEEP2, 300)
                  } catch (_: Exception) {}
              }

              private fun label(s: String) =
                  txt(s, 13f, Color.rgb(120,255,50), true).apply {
                      setPadding(0, dp(16), 0, dp(5))
                  }

              private fun input(value: String) =
                  EditText(this).apply {
                      setText(value)
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      inputType =
                          android.text.InputType.TYPE_CLASS_NUMBER or
                          android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      setBackgroundColor(Color.rgb(28,34,44))
                  }

              private fun txt(
                  s: String,
                  size: Float,
                  color: Int,
                  bold: Boolean
              ) = TextView(this).apply {
                  text = s
                  textSize = size
                  setTextColor(color)
                  if (bold) setTypeface(typeface, Typeface.BOLD)
              }

              private fun space(parent: LinearLayout) {
                  parent.addView(View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(1, dp(12))
                  })
              }

              private fun dp(v: Int) =
                  (v * resources.displayMetrics.density).toInt()
          }
          EOF

          cat > app/src/main/java/com/orderhelper/app/OfferAssistService.kt <<'EOF'
          package com.orderhelper.app

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.TextView

          class OfferAssistService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var overlay: View? = null
              private var lastKey = ""
              private var lastTime = 0L

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.packageName?.toString() != "com.walmart.sparkdriver") {
                      removeOverlay()
                      return
                  }

                  handler.removeCallbacksAndMessages(null)
                  handler.postDelayed({ scan() }, 180)
              }

              override fun onInterrupt() {
                  removeOverlay()
              }

              private fun scan() {
                  val root = rootInActiveWindow ?: return

                  val prefs = getSharedPreferences("filters", MODE_PRIVATE)
                  val minPay = prefs.getFloat("minPay", 25f)
                  val minPerMile = prefs.getFloat("minPerMile", 2f)
                  val maxMiles = prefs.getFloat("maxMiles", 10f)

                  val offers = mutableListOf<Offer>()
                  walk(root, offers)

                  val best = offers
                      .filter {
                          it.pay >= minPay &&
                          it.miles > 0 &&
                          it.miles <= maxMiles &&
                          (it.pay / it.miles) >= minPerMile
                      }
                      .maxByOrNull { it.pay / it.miles }

                  if (best == null) {
                      removeOverlay()
                      return
                  }

                  showOverlay(best)

                  val key = "${best.pay}-${best.miles}"
                  val now = System.currentTimeMillis()

                  if (key != lastKey || now - lastTime > 20000) {
                      lastKey = key
                      lastTime = now
                      alert()
                  }
              }

              private fun walk(
                  node: AccessibilityNodeInfo,
                  out: MutableList<Offer>
              ) {
                  val text = node.text?.toString().orEmpty()

                  if (text.contains("$")) {
                      candidate(node)?.let { out.add(it) }
                  }

                  for (i in 0 until node.childCount) {
                      node.getChild(i)?.let { walk(it, out) }
                  }
              }

              private fun candidate(start: AccessibilityNodeInfo): Offer? {
                  var n: AccessibilityNodeInfo? = start

                  repeat(6) {
                      val node = n ?: return@repeat
                      val all = collect(node)

                      val pay = Regex("""\$\s*(\d+(?:[.,]\d{1,2})?)""")
                          .find(all)
                          ?.groupValues
                          ?.getOrNull(1)
                          ?.replace(",", ".")
                          ?.toFloatOrNull()

                      val miles = Regex(
                          """(\d+(?:[.,]\d+)?)\s*(?:mi|millas?)\b""",
                          RegexOption.IGNORE_CASE
                      )
                          .find(all)
                          ?.groupValues
                          ?.getOrNull(1)
                          ?.replace(",", ".")
                          ?.toFloatOrNull()

                      if (pay != null && miles != null && miles > 0f) {
                          val r = Rect()
                          node.getBoundsInScreen(r)

                          if (r.width() > 200 && r.height() > 70) {
                              return Offer(pay, miles, r)
                          }
                      }

                      n = node.parent
                  }

                  return null
              }

              private fun collect(
                  node: AccessibilityNodeInfo,
                  depth: Int = 0
              ): String {
                  if (depth > 6) return ""

                  val b = StringBuilder()

                  node.text?.toString()?.let { b.append(it).append(" ") }
                  node.contentDescription?.toString()?.let { b.append(it).append(" ") }

                  for (i in 0 until node.childCount) {
                      node.getChild(i)?.let {
                          b.append(collect(it, depth + 1))
                      }
                  }

                  return b.toString()
              }

              private fun showOverlay(o: Offer) {
                  removeOverlay()

                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val view = TextView(this).apply {
                      text = "✓ MEJOR OFERTA  $${"%.2f".format(o.pay)}  ${"%.1f".format(o.miles)} mi"
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      setPadding(dp(6), dp(4), dp(6), 0)

                      background = GradientDrawable().apply {
                          setColor(Color.argb(35, 80, 255, 40))
                          setStroke(dp(4), Color.rgb(80,255,40))
                          cornerRadius = dp(12).toFloat()
                      }
                  }

                  val p = WindowManager.LayoutParams(
                      o.bounds.width(),
                      o.bounds.height(),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = o.bounds.left
                      y = o.bounds.top
                  }

                  try {
                      wm.addView(view, p)
                      overlay = view
                  } catch (_: Exception) {}
              }

              private fun removeOverlay() {
                  val v = overlay ?: return

                  try {
                      val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      wm.removeView(v)
                  } catch (_: Exception) {}

                  overlay = null
              }

              private fun alert() {
                  try {
                      val v = getSystemService(VIBRATOR_SERVICE) as Vibrator
                      v.vibrate(
                          VibrationEffect.createOneShot(
                              250,
                              VibrationEffect.DEFAULT_AMPLITUDE
                          )
                      )
                  } catch (_: Exception) {}

                  try {
                      ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100)
                          .startTone(ToneGenerator.TONE_PROP_BEEP2, 300)
                  } catch (_: Exception) {}
              }

              private fun dp(v: Int) =
                  (v * resources.displayMetrics.density).toInt()

              data class Offer(
                  val pay: Float,
                  val miles: Float,
                  val bounds: Rect
              )
          }
          EOF

      - name: Guardar en main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Agregar Order Helper funcional"
          git push origin HEAD:main
