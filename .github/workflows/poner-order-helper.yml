name: Poner Order Helper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Crear carpetas
        run: |
          mkdir -p app/src/main/java/com/orderhelper/app
          mkdir -p app/src/main/res/xml

      - name: Crear AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="Order Helper"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OfferAssistService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

              </application>
          </manifest>
          EOF

      - name: Crear configuración de accesibilidad
        run: |
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="150"
              android:canRetrieveWindowContent="true"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:packageNames="com.walmart.sparkdriver" />
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Order Helper</string>
              <string name="accessibility_description">Analiza las ofertas visibles de Spark y señala las que cumplen tus filtros.</string>
          </resources>
          EOF

      - name: Crear pantalla principal
        run: |
          cat > app/src/main/java/com/orderhelper/app/MainActivity.kt <<'EOF'
          package com.orderhelper.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import android.graphics.Typeface

          class MainActivity : Activity() {

              private lateinit var statusText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("filters", MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(28), dp(22), dp(24))
                      setBackgroundColor(Color.rgb(8, 12, 18))
                  }

                  val scroll = ScrollView(this)
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  box.addView(text("🎯 ORDER HELPER", 28f, Color.rgb(124, 255, 45), true))
                  box.addView(text("Detecta • Vibra • Suena • Señala", 15f, Color.LTGRAY, false))

                  statusText = text("", 17f, Color.WHITE, true)
                  statusText.setPadding(0, dp(22), 0, dp(12))
                  box.addView(statusText)

                  box.addView(label("PAGO MÍNIMO ($)"))
                  val minPay = input(prefs.getFloat("minPay", 25f).toString())
                  box.addView(minPay)

                  box.addView(label("$/MILLA MÍNIMO"))
                  val minPerMile = input(prefs.getFloat("minPerMile", 2f).toString())
                  box.addView(minPerMile)

                  box.addView(label("MILLAS MÁXIMAS"))
                  val maxMiles = input(prefs.getFloat("maxMiles", 10f).toString())
                  box.addView(maxMiles)

                  val save = Button(this).apply {
                      text = "💾 GUARDAR FILTROS"
                      textSize = 17f
                      setTextColor(Color.BLACK)
                      setBackgroundColor(Color.rgb(124, 255, 45))
                      setPadding(8, 14, 8, 14)
                      setOnClickListener {
                          prefs.edit()
                              .putFloat("minPay", minPay.text.toString().toFloatOrNull() ?: 25f)
                              .putFloat("minPerMile", minPerMile.text.toString().toFloatOrNull() ?: 2f)
                              .putFloat("maxMiles", maxMiles.text.toString().toFloatOrNull() ?: 10f)
                              .apply()

                          Toast.makeText(this@MainActivity, "Filtros guardados ✅", Toast.LENGTH_SHORT).show()
                      }
                  }
                  addSpace(box, 18)
                  box.addView(save)

                  val access = Button(this).apply {
                      text = "⚙️ ACTIVAR ORDER HELPER"
                      textSize = 17f
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  addSpace(box, 12)
                  box.addView(access)

                  val test = Button(this).apply {
                      text = "📳🔊 PROBAR SONIDO Y VIBRACIÓN"
                     
